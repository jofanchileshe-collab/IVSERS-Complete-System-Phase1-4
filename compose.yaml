services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/ivsers
      JWT_SECRET: ${JWT_SECRET:-replace-this-for-local-development}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-System Administrator}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@ivsers.local}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      SUPER_ADMIN_PHONE: ${SUPER_ADMIN_PHONE:-}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
