<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IVSERS</title>
  <meta http-equiv="refresh" content="0; url=login.html" />
  <script src="assets/config.js"></script>
  <script src="script.js"></script>
  <script>
    // Immediate client-side redirect (the meta-refresh above is a no-JS
    // fallback for the brief window before this executes).
    window.location.replace(
      IVSERSAuth.isAuthenticated() ? 'dashboard/dashboard.html' : 'login.html'
    );
  </script>
</head>
<body>
  <noscript>
    <p style="font-family: sans-serif; padding: 24px;">
      IVSERS requires JavaScript. Please <a href="login.html">continue to sign in</a>.
    </p>
  </noscript>
</body>
</html>
