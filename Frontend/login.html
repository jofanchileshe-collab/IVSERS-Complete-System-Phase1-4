<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in - IVSERS</title>
  <meta name="description" content="IVSERS fleet safety console sign-in" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Page-specific layout only - shared tokens/components live in style.css */
    .login-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: var(--space-5);
      position: relative;
      z-index: 1;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      padding: var(--space-6) var(--space-5);
    }

    .login-brand {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-6);
    }

    .login-brand .mark {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--accent-dim);
      display: grid;
      place-items: center;
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
    }

    .login-brand .name {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .login-brand .sub {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.03em;
    }

    .login-form { display: flex; flex-direction: column; gap: var(--space-4); }

    .field { display: flex; flex-direction: column; gap: var(--space-2); }
    .field label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #form-error {
      display: none;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--danger);
      background: rgba(228, 72, 58, 0.08);
      border: 1px solid rgba(228, 72, 58, 0.3);
      border-radius: var(--radius-sm);
      padding: var(--space-2) var(--space-3);
    }
    #form-error.visible { display: block; }

    .login-footer {
      margin-top: var(--space-5);
      text-align: center;
      font-size: 12px;
      color: var(--text-dim);
    }
  </style>
</head>
<body>
  <div class="login-shell">
    <div class="card card--bracketed login-card">
      <div class="login-brand">
        <div class="mark" aria-hidden="true">IV</div>
        <div>
          <div class="name">IVSERS</div>
          <div class="sub">Fleet Safety Console</div>
        </div>
      </div>

      <form class="login-form" id="login-form" novalidate>
        <div id="form-error" role="alert"></div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="username" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </div>

        <button type="submit" class="primary" id="submit-btn" style="width:100%;">
          Sign in
        </button>
      </form>

      <div class="login-footer">
        <p><a href="demo-login.html">Open the simulated demo</a></p>
        Zambia Air Services Training Institute<br />
        School of Aircraft Maintenance Engineering
      </div>
    </div>
  </div>

  <script src="assets/config.js"></script>
  <script src="script.js"></script>
  <script>
    IVSERSAuth.redirectIfAuthenticated();

    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('form-error');
    const submitBtn = document.getElementById('submit-btn');

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.add('visible');
    }

    function clearError() {
      errorBox.textContent = '';
      errorBox.classList.remove('visible');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearError();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showError('Enter your email and password.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        await IVSERSAuth.login(email, password);
        window.location.href = 'dashboard/dashboard.html';
      } catch (err) {
        showError(err.message || 'Sign-in failed. Check your credentials and try again.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
