; ============================================================================
; IVSERS - platformio.ini
;
; Defines two independent build environments so both firmware targets live
; in one PlatformIO project without their library sets colliding.
;
; Build/upload examples:
;   pio run -e mega2560 -t upload
;   pio run -e esp32dev -t upload
;   pio device monitor -e mega2560
; ============================================================================

[platformio]
default_envs = mega2560, esp32dev

; ----------------------------------------------------------------------------
; Arduino Mega 2560 - core hazard detection / suppression / telemetry
; ----------------------------------------------------------------------------
[env:mega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
src_dir = Arduino_Mega_IVSERS
monitor_speed = 115200
lib_deps =
    mikalhart/TinyGPSPlus @ ^1.0.3
    bogde/HX711 @ ^0.7.5
    electroniccats/MPU6050 @ ^1.4.3
    adafruit/DHT sensor library @ ^1.4.4
    adafruit/Adafruit Unified Sensor @ ^1.1.9

; ----------------------------------------------------------------------------
; ESP32 - cloud bridge (Wi-Fi / MQTT / HTTPS / OTA)
; ----------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
src_dir = ESP32_Cloud_Bridge
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.3
build_flags =
    -DCORE_DEBUG_LEVEL=1
